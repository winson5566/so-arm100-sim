[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so-arm100-sim"
version = "0.1.0"
description = "SO-ARM100 pick & place in MuJoCo with LeRobot + ACT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.1",
    "lerobot[dataset,training,timm-dep]>=0.6.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/so_arm100_sim"]
