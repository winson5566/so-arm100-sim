# LeRobot ACT training config for the SO-ARM100 pick & place dataset.
#
# Run with:
#   .venv/bin/lerobot-train --config_path=configs/train_act.yaml
#
# NOTE: images are resized to 224x224 before the ResNet backbone. This is what
# the ACT paper does; without it LeRobot feeds the raw 640x480 frames to
# ResNet, making training ~3.6x slower (measured 1.9 -> 6.7 steps/s on MPS).
# eval_act.py applies the same resize by default, so train/eval stay consistent.
dataset:
  repo_id: local/so_arm100_pick
  root: data/local/so_arm100_pick
  # Hold out a fraction of episodes for offline eval loss.
  eval_split: 0.0
  image_transforms:
    enable: true
    max_num_transforms: 1
    tfs:
      resize:
        type: Resize
        kwargs:
          size: [224, 224]

policy:
  type: act
  push_to_hub: false
  # Use "mps" on Apple Silicon for faster training; "cpu" always works.
  device: mps
  n_obs_steps: 1
  chunk_size: 100
  # Official ACT inference uses temporal ensembling (Algo. 2 of the paper,
  # coefficient 0.01), which queries the policy every step and averages action
  # chunks. LeRobot requires n_action_steps=1 when temporal ensembling is on.
  n_action_steps: 1
  temporal_ensemble_coeff: 0.01
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  dim_model: 256
  n_heads: 4
  dim_feedforward: 1600
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  optimizer_lr: 1e-5
  optimizer_lr_backbone: 1e-5
  optimizer_weight_decay: 1e-4

# ACT recipe: 50 demos, 2000 epochs, batch 8 (paper reports ~90% on Transfer Cube).
# steps = 2000 epochs * ceil(total_frames / batch_size). Value below is computed
# from the collected 50-episode dataset (47,530 frames -> 5,942 steps/epoch);
# update it if the episode length changes.
steps: 11884000
batch_size: 8
num_workers: 4
prefetch_factor: 2
persistent_workers: true
log_freq: 1000
save_freq: 200000
env_eval_freq: 0
eval_steps: 0
seed: 1000
output_dir: outputs/train_act_50ep
use_policy_training_preset: true

wandb:
  enable: false
